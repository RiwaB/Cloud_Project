name: Deploy Full-Stack to Elastic Beanstalk

on:
  push:
    branches:
      - elastic-beanstalk-ec2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout Source
        uses: actions/checkout@v5

      # 2️⃣ Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      # 3️⃣ Install frontend dependencies
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # 4️⃣ Build frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # 5️⃣ Install backend dependencies
      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      # 6️⃣ Copy frontend build into backend folder
      - name: Copy frontend build into backend
        run: cp -r ../frontend/build ./frontend-build
        working-directory: backend

      # 7️⃣ Generate deployment zip (backend + frontend)
      - name: Generate Deployment Package
        run: zip -r ../fullstack-app.zip ./*
        working-directory: backend

      # 8️⃣ Deploy to Elastic Beanstalk
      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.ELASTIC_BEANSTALK }}
          aws_secret_key: ${{ secrets.ELASTIC_BEANSTALK_SECRET }}
          application_name: 'Cloud_Project'
          environment_name: 'CloudProject-env'
          version_label: ${{ github.sha }}
          region: us-east-1
          deployment_package: backend/fullstack-app.zip
